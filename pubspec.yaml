name: encrypt
version: 5.0.5
description: A set of high-level APIs over PointyCastle for two-way cryptography.
repository: https://github.com/timmaffett/encrypt

executables:
  secure-random:

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  args: ^2.7.0   # was 2.3.1
  #asn1lib: ^1.6.5   # was1.5.0  # now using pointycastle's asn1 support
  clock: ^1.1.2   # was1.1.1
  collection: ^1.19.1  # was 1.17.0
  crypto: ^3.0.6  # was 3.0.2
  pointycastle: ^4.0.0 # was 3.7.3

dev_dependencies:
  lints: ^6.0.0   # was 2.0.0
  test: ^1.26.3  # was 1.24.0

false_secrets:
 - /test/*.pem
